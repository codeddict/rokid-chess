plugins { id 'com.android.application' }
android {
    namespace 'com.sjtec.rokidchess.glasses'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sjtec.rokidchess.glasses'
        minSdk 31
        targetSdk 36
        versionCode 10
        versionName '0.6.2'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/libstockfish.so' } }
    sourceSets { main { java.srcDirs = ['src/main/java','../chesscore/java','../chessshared/java'] }; test { java.srcDirs = ['src/test/java','../chesscore/test'] } }
    testOptions { unitTests.returnDefaultValues = true; unitTests.all {
        systemProperty 'chess.root', rootProject.projectDir.absolutePath
        systemProperty 'chess.opencv.native', rootProject.file('.tools/opencv-host/official412/opencv/build/java/x64/opencv_java4120.dll').absolutePath
    } }
}
dependencies {
    implementation files('../chessphone/libs/chesslib-1.3.6.jar')
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'androidx.core:core:1.16.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
