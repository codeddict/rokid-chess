plugins { id 'com.android.application' }
android {
    namespace 'com.sjtec.rokidchess'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sjtec.rokidchess'
        minSdk 31
        targetSdk 36
        versionCode 7
        versionName '0.5.2'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/libstockfish.so' } }
    buildFeatures { buildConfig true }
    sourceSets { main { java.srcDirs += '../chessshared/java'; assets.srcDirs += layout.buildDirectory.dir('generated/chess-assets').get().asFile } }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            systemProperty 'chess.root', rootProject.projectDir.absolutePath
            systemProperty 'chess.opencv.native', rootProject.file('.tools/opencv-host/official412/opencv/build/java/x64/opencv_java4120.dll').absolutePath
        }
    }
}
dependencies {
    implementation 'com.rokid.cxr:client-l:1.1.2'
    implementation 'androidx.core:core:1.16.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    implementation files('libs/chesslib-1.3.6.jar')
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.opencv:opencv:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
tasks.register('embedChessGlasses', Copy) {
    dependsOn ':chessglasses:assembleDebug'
    from(project(':chessglasses').layout.buildDirectory.file('outputs/apk/debug/chessglasses-debug.apk'))
    into(layout.buildDirectory.dir('generated/chess-assets'))
    rename { 'chess-glasses.apk' }
}
tasks.named('preBuild') { dependsOn 'embedChessGlasses' }
